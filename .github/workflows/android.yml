name: android-apk

# Builds the ClearVoice Android debug APK. Runs on tag pushes (v*) and manually
# from the Actions tab. On tag pushes the APK is attached to a GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch vendored RNNoise sources + model (hash-verified, with retries)
        run: |
          for i in 1 2 3; do
            python3 scripts/fetch_rnnoise.py && exit 0
            echo "attempt $i failed, retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # this action installs the SDK and exports ANDROID_HOME / ANDROID_SDK_ROOT
        # for all following steps — do NOT override them

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearvoice-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          prerelease: true