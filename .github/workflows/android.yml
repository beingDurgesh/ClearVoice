name: android-apk

# Builds the ClearVoice Android APK on tag pushes (v*) and manual runs.
# On tag pushes the APK is attached to a GitHub Release.
#
# NOTE: we do NOT use android-actions/setup-android — it installs the legacy
# 'tools' package which Google has removed (sdkmanager: "Failed to find package
# 'tools'"). Instead we install current cmdline-tools directly.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch vendored RNNoise sources + model (hash-verified, with retries)
        run: |
          for i in 1 2 3; do
            python3 scripts/fetch_rnnoise.py && exit 0
            echo "attempt $i failed, retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Install Android cmdline-tools + packages
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL --retry 5 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/cmdline-tools"
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode release keystore (only when the secret exists)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/release.keystore
            echo "keystore decoded"
          else
            echo "no keystore secret -> debug build"
          fi

      - name: Build APK (release-signed if keystore present, else debug)
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f release.keystore ]; then
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK as workflow artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: clearvoice-apk
          path: android/app/build/outputs/apk/*/app-*.apk

      - name: Attach APK to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/*/app-*.apk
          generate_release_notes: true
